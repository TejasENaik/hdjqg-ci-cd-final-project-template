apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.19
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jest
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        npm ci
        npm test -- --runInBand
